name: ARES API and Prototype Tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python source and tests
        run: python -m compileall -q app.py src tests
      - name: Run entire pytest suite
        run: python -m pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend for real HTTP integration checks
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check TypeScript and production build
        run: npm run build
      - name: Run frontend unit and component tests
        run: npm test
      - name: Verify live Vite proxy and FastAPI integration
        working-directory: .
        shell: bash
        run: |
          python -m uvicorn src.ares_health.api:app --host 127.0.0.1 --port 8000 > /tmp/ares-api.log 2>&1 &
          ARES_API_PID=$!
          npm --prefix frontend run dev > /tmp/ares-vite.log 2>&1 &
          ARES_VITE_PID=$!
          trap 'kill "$ARES_API_PID" "$ARES_VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/api/status > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/api/status
          npm --prefix frontend run test:integration

  research-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install opt-in research tools
        run: python -m pip install -r requirements-research.txt
      - name: Check pinned tool compatibility
        run: python -m pip check
      - name: Run offline WFDB and NeuroKit fixture integration
        run: python -m pytest -q optional_checks/ecg_integration.py
